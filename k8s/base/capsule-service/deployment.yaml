apiVersion: apps/v1
kind: Deployment
metadata:
  name: capsule-service
  labels:
    app: capsule-service
    version: v1
spec:
  # Une seule réplique tant que la base est en mémoire.
  replicas: 1
  selector:
    matchLabels:
      app: capsule-service
  template:
    metadata:
      labels:
        app: capsule-service
        version: v1
    spec:
      serviceAccountName: capsule-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: capsule-service
          image: capsule-service
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CHRONOSEAL_SEAL_HOST
              value: seal-service
            - name: CHRONOSEAL_SEAL_PORT
              value: "50051"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
