apiVersion: apps/v1
kind: Deployment
metadata:
  name: seal-service
  labels:
    app: seal-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: seal-service
  template:
    metadata:
      labels:
        app: seal-service
        version: v1
    spec:
      serviceAccountName: seal-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seal-service
          image: seal-service
          ports:
            - name: grpc
              containerPort: 50051
          env:
            # Créé à la main, jamais versionné (voir docs/deploiement.md).
            - name: SEAL_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seal-master-key
                  key: key-id
            - name: SEAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: seal-master-key
                  key: master-key
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
