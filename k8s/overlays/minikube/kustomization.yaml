# Images construites directement dans Minikube.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Avec un tag autre que latest, Kubernetes utilise l'image locale.
images:
  - name: ghcr.io/tacoao/chronoseal/capsule-service
    newName: chronoseal/capsule-service
    newTag: dev
  - name: ghcr.io/tacoao/chronoseal/seal-service
    newName: chronoseal/seal-service
    newTag: dev
