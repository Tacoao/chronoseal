version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /apps/capsule-service
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    ignore:
      # Les montées majeures (Java, Gradle) se feront à la main.
      - dependency-name: gradle
        update-types:
          - version-update:semver-major
      - dependency-name: eclipse-temurin
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /apps/seal-service
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /apps/seal-service
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /apps/capsule-service
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch
