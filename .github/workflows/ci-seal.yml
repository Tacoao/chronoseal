name: CI - seal-service

on:
  push:
    branches: [main]
    paths:
      - 'apps/seal-service/**'
      - 'proto/**'
      - 'scripts/**'
      - 'ruff.toml'
      - '.github/workflows/ci-seal.yml'
  # Pas de filtre paths sur les PR, sinon un contrôle requis peut ne jamais arriver.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: seal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  SERVICE: seal-service

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/seal-service/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r apps/seal-service/requirements-dev.txt

      - name: Generate gRPC code from proto/
        run: python scripts/project.py proto-python

      - name: Run tests
        working-directory: apps/seal-service
        run: |
          mkdir -p build/test-results
          python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-reports
          path: apps/seal-service/build/test-results/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/seal-service/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r apps/seal-service/requirements-dev.txt

      - name: Run Ruff on seal-service
        working-directory: apps/seal-service
        run: |
          python -m ruff check app tests
          python -m ruff format --check app tests

      - name: Run Ruff on repository scripts
        run: |
          python -m ruff check scripts
          python -m ruff format --check scripts

  docker:
    name: Python Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, quality]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Les noms d'image doivent être en minuscules.
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: apps/seal-service
          build-contexts: proto=proto
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=seal-service
          cache-to: type=gha,scope=seal-service,mode=max
