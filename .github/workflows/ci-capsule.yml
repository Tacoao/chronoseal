name: CI - capsule-service

on:
  push:
    branches: [main]
    paths:
      - 'apps/capsule-service/**'
      - 'proto/**'
      - '.github/workflows/ci-capsule.yml'
  # Pas de filtre paths sur les PR, sinon un contrôle requis peut ne jamais arriver.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: capsule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  SERVICE: capsule-service

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            apps/capsule-service/*.gradle
            apps/capsule-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests
        working-directory: apps/capsule-service
        run: ./gradlew clean test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: |
            apps/capsule-service/build/test-results/test/
            apps/capsule-service/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Java quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            apps/capsule-service/*.gradle
            apps/capsule-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run Checkstyle
        working-directory: apps/capsule-service
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-quality-reports
          path: apps/capsule-service/build/reports/checkstyle/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Java Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, quality]
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Les noms d'image doivent être en minuscules.
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/capsule-service
          build-contexts: proto=proto
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=capsule-service
          cache-to: type=gha,scope=capsule-service,mode=max

  supply-chain:
    name: Java supply chain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: docker
    permissions:
      contents: read
      packages: write
      # Pour signer sans clé (OIDC).
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    env:
      # Tout se fait sur le digest, jamais sur un tag.
      IMAGE_NAME: ${{ needs.docker.outputs.image }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      IMAGE_REF: ${{ needs.docker.outputs.image }}@${{ needs.docker.outputs.digest }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image by digest
        run: cosign sign --yes "$IMAGE_REF"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: java-sbom.spdx.json
          artifact-name: java-sbom.spdx.json
          upload-artifact-retention: 7

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: java-sbom.spdx.json
          push-to-registry: true

      - name: Verify signature and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci-capsule.yml@refs/heads/main
        run: |
          cosign verify \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE_REF"
          gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY"

      - name: Scan published digest with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-capsule-service.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-capsule-service.sarif
          category: trivy-capsule-service
