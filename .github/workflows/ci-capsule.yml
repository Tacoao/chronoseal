name: CI - capsule-service

on:
  push:
    branches: [main]
    paths:
      - 'apps/capsule-service/**'
      - 'proto/**'
      - '.github/workflows/ci-capsule.yml'
  # Pas de filtre paths sur les PR, sinon un contrôle requis peut ne jamais arriver.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: capsule-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  SERVICE: capsule-service

jobs:
  test:
    name: Java tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            apps/capsule-service/*.gradle
            apps/capsule-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests
        working-directory: apps/capsule-service
        run: ./gradlew clean test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: |
            apps/capsule-service/build/test-results/test/
            apps/capsule-service/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Java quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            apps/capsule-service/*.gradle
            apps/capsule-service/gradle/wrapper/gradle-wrapper.properties

      - name: Run Checkstyle
        working-directory: apps/capsule-service
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-quality-reports
          path: apps/capsule-service/build/reports/checkstyle/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Java Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, quality]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Les noms d'image doivent être en minuscules.
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${SERVICE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: apps/capsule-service
          build-contexts: proto=proto
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=capsule-service
          cache-to: type=gha,scope=capsule-service,mode=max
