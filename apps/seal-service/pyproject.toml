[project]
name = "seal-service"
version = "0.1.0"
description = "Service de scellement temporel de Chronoseal"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# gen/ : code généré par `python scripts/project.py proto-python`
pythonpath = [".", "gen"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
