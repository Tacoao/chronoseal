spring.application.name=capsule-service
server.port=8080
server.shutdown=graceful

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# CHRONOSEAL_SEAL_HOST remplace l'hôte dans les conteneurs.
chronoseal.seal.host=localhost
chronoseal.seal.port=50051
chronoseal.seal.deadline=3s
